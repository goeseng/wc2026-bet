<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 월드컵 스코어 내기 — 대한민국</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --red: #C8102E; --navy: #002868; --bg: #F6F6F4; --card: #FFFFFF;
    --border: #E2E2DE; --text: #1A1A1A; --muted: #6B6B68; --accent-bg: #FFF5F7;
    --green: #1a7a4a; --green-bg: #E8F8EF; --green-border: #A8DFC0;
  }
  body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 4rem; }

  /* HERO */
  .hero { background: var(--navy); padding: 2.5rem 1.5rem 2rem; text-align: center; position: relative; overflow: hidden; }
  .hero::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--red) 50%, #FFD700 50%); }
  .hero-flags { font-size: 2rem; letter-spacing: 6px; margin-bottom: 1rem; }
  .hero-title { font-size: clamp(1.25rem, 5vw, 1.7rem); font-weight: 700; color: #fff; line-height: 1.3; margin-bottom: 0.4rem; }
  .hero-sub { font-size: 0.85rem; color: rgba(255,255,255,0.6); }
  .hero-badge { display: inline-block; margin-top: 1rem; background: var(--red); color: #fff; font-size: 0.78rem; font-weight: 500; padding: 5px 16px; border-radius: 20px; }

  .container { max-width: 560px; margin: 0 auto; padding: 0 1rem; }

  /* 로딩 */
  .loading-screen { text-align: center; padding: 3rem 1rem; color: var(--muted); font-size: 0.9rem; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--navy); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 계좌 */
  .account-card { background: var(--card); border: 1.5px solid var(--navy); border-radius: 14px; padding: 1.1rem 1.25rem; margin: 1.5rem 0 0; }
  .account-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.9rem; }
  .account-title { font-size: 0.72rem; font-weight: 700; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; }
  .total-badge { font-size: 0.78rem; font-weight: 700; color: var(--navy); background: #EDF1FF; border: 1px solid #B8C8F0; padding: 3px 12px; border-radius: 20px; }
  .account-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--border); }
  .account-row:last-child { border-bottom: none; }
  .acc-label { font-size: 0.8rem; color: var(--muted); }
  .acc-value { font-size: 0.88rem; font-weight: 700; color: var(--text); }
  .copy-btn { font-size: 0.72rem; color: var(--navy); background: #EDF1FF; border: 1px solid #B8C8F0; border-radius: 8px; padding: 3px 10px; cursor: pointer; margin-left: 8px; font-family: 'Noto Sans KR', sans-serif; }
  .payment-grid { margin-top: 0.9rem; display: flex; flex-wrap: wrap; gap: 6px; }
  .payment-chip { display: flex; align-items: center; gap: 5px; font-size: 0.78rem; padding: 5px 10px; border-radius: 8px; font-weight: 500; }
  .payment-chip.paid   { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
  .payment-chip.unpaid { background: var(--bg); color: var(--muted); border: 1px solid var(--border); }
  .pay-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .paid .pay-dot { background: var(--green); }
  .unpaid .pay-dot { background: #ccc; }

  /* 참가비 */
  .fee-banner { background: var(--accent-bg); border: 1.5px solid var(--red); border-radius: 14px; padding: 1rem 1.25rem; display: flex; justify-content: space-between; align-items: center; margin: 1rem 0; }
  .fee-label  { font-size: 0.8rem; color: var(--muted); margin-bottom: 2px; }
  .fee-amount { font-size: 1.6rem; font-weight: 700; color: var(--red); }
  .fee-note   { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }

  /* 규칙 */
  .rules-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1.1rem 1.25rem; margin-bottom: 1.5rem; }
  .section-label { font-size: 0.72rem; font-weight: 700; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; margin-bottom: 0.7rem; }
  .rules-list { list-style: none; }
  .rules-list li { font-size: 0.85rem; color: var(--text); padding: 6px 0; display: flex; gap: 10px; align-items: flex-start; line-height: 1.55; border-bottom: 1px solid var(--border); }
  .rules-list li:last-child { border-bottom: none; }
  .rules-list li::before { content: ''; width: 6px; height: 6px; min-width: 6px; background: var(--red); border-radius: 50%; margin-top: 7px; }
  .rules-list strong { color: var(--navy); }

  /* 경기 카드 */
  .match-section-label { font-size: 0.72rem; font-weight: 700; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; margin-bottom: 0.75rem; }
  .match-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1rem 1.25rem; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; transition: opacity 0.2s; }
  .match-card.closed { opacity: 0.6; background: #F0F0EE; }
  .match-seq { font-size: 0.7rem; font-weight: 700; color: var(--red); background: var(--accent-bg); border: 1px solid #F5C0CC; border-radius: 8px; padding: 5px 9px; white-space: nowrap; text-align: center; min-width: 42px; }
  .match-card.closed .match-seq { color: var(--muted); background: var(--bg); border-color: var(--border); }
  .match-body { flex: 1; }
  .match-opponent { font-size: 0.95rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
  .match-meta { font-size: 0.75rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px; }
  .status-badge { display: inline-block; font-size: 0.7rem; font-weight: 700; border-radius: 20px; padding: 2px 10px; margin-top: 5px; }
  .status-badge.open   { color: var(--green); background: var(--green-bg); border: 1px solid var(--green-border); }
  .status-badge.closed { color: var(--muted); background: var(--bg); border: 1px solid var(--border); }
  .score-box { display: flex; align-items: center; gap: 5px; }
  .score-input { width: 44px; height: 44px; text-align: center; font-size: 1.2rem; font-weight: 700; font-family: 'Noto Sans KR', sans-serif; border: 2px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); -moz-appearance: textfield; transition: border-color 0.15s; }
  .score-input:focus { outline: none; border-color: var(--navy); background: #fff; }
  .score-input:disabled { background: #E8E8E6; color: var(--muted); cursor: not-allowed; }
  .score-input::-webkit-outer-spin-button, .score-input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .score-sep { font-size: 1.1rem; font-weight: 700; color: var(--muted); }

  /* 제출 */
  .name-row { display: flex; gap: 8px; margin-top: 1.5rem; }
  .name-input { flex: 1; height: 48px; border: 1.5px solid var(--border); border-radius: 12px; padding: 0 14px; font-size: 0.9rem; font-family: 'Noto Sans KR', sans-serif; background: var(--card); color: var(--text); transition: border-color 0.15s; }
  .name-input:focus { outline: none; border-color: var(--navy); }
  .submit-btn { height: 48px; padding: 0 22px; background: var(--navy); color: #fff; border: none; border-radius: 12px; font-size: 0.9rem; font-weight: 700; font-family: 'Noto Sans KR', sans-serif; cursor: pointer; transition: background 0.15s; white-space: nowrap; }
  .submit-btn:hover { background: #001f52; }
  .submit-btn:disabled { background: var(--muted); cursor: not-allowed; }
  .no-open-notice { text-align: center; padding: 1.2rem; font-size: 0.85rem; color: var(--muted); background: var(--card); border: 1px solid var(--border); border-radius: 14px; margin-top: 1rem; }

  /* 참가자 현황 */
  .participants-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1rem 1.25rem; margin-top: 1.5rem; }
  .participants-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .prize-badge { font-size: 0.78rem; font-weight: 700; color: var(--red); background: var(--accent-bg); border: 1px solid #F5C0CC; padding: 4px 12px; border-radius: 20px; }
  .participant-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 0.82rem; gap: 10px; }
  .participant-row:last-child { border-bottom: none; }
  .p-name { font-weight: 700; color: var(--navy); min-width: 60px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .paid-mark { font-size: 0.65rem; background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); border-radius: 10px; padding: 1px 6px; font-weight: 700; }
  .p-scores { color: var(--muted); text-align: right; line-height: 1.8; }

  .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--navy); color: #fff; font-size: 0.85rem; font-weight: 500; padding: 10px 22px; border-radius: 30px; opacity: 0; transition: opacity 0.25s, transform 0.25s; z-index: 999; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .footer-link { text-align: center; margin-top: 2.5rem; font-size: 0.75rem; color: var(--muted); }
  .footer-link a { color: var(--muted); }
  .error-msg { text-align: center; padding: 1rem; font-size: 0.82rem; color: var(--red); background: #FFF5F7; border: 1px solid #F5C0CC; border-radius: 10px; margin-top: 1rem; }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-flags">🇰🇷⚽🇨🇿🇲🇽🇿🇦</div>
  <div class="hero-title">2026 북중미 FIFA 월드컵<br>스코어 맞추기 내기</div>
  <div class="hero-sub">대한민국 A조 조별예선 · 3경기</div>
  <div class="hero-badge" id="hero-badge">참가비 5,000원 · 전액 상금</div>
</div>

<div class="container">
  <div id="main-content">
    <div class="loading-screen"><div class="spinner"></div>불러오는 중...</div>
  </div>
  <div class="footer-link"><a href="admin.html">관리자 페이지</a></div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://api.anthropic.com/v1/messages';
const MODEL = 'claude-sonnet-4-20250514';
const STORE_KEY = 'wc2026_store'; // persistent storage key

const MATCH_INFO = [
  { seq:'1차전', label:'🇰🇷 대한민국 vs 체코 🇨🇿',   short:'체코전',   date:'📅 6월 12일 (금)', time:'⏰ 오전 11:00', venue:'📍 과달라하라 아크론' },
  { seq:'2차전', label:'🇰🇷 대한민국 vs 멕시코 🇲🇽', short:'멕시코전', date:'📅 6월 19일 (금)', time:'⏰ 오전 10:00', venue:'📍 과달라하라 아크론' },
  { seq:'3차전', label:'🇰🇷 대한민국 vs 남아공 🇿🇦', short:'남아공전', date:'📅 6월 25일 (목)', time:'⏰ 오전 10:00', venue:'📍 몬테레이 BBVA' },
];

// 기본 상태
const DEFAULT_STATE = {
  account: { bank:'', account:'', holder:'', fee: 5000 },
  matchOpen: [false, false, false],
  picks: [],
  payments: {},
  results: [null, null, null],
};

let state = null;

function showToast(msg, dur=2500) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}

/* ── API: 상태 읽기 ── */
async function loadState() {
  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: MODEL,
        max_tokens: 1000,
        system: 'You manage a key-value store. When asked to GET a key, respond with ONLY the raw JSON value stored for that key, or the exact string NULL if not found. No explanation.',
        messages: [{ role: 'user', content: `GET ${STORE_KEY}` }]
      })
    });
    const data = await res.json();
    const text = data.content?.map(c => c.text || '').join('').trim();
    if (!text || text === 'NULL') return { ...DEFAULT_STATE };
    return JSON.parse(text);
  } catch(e) {
    return { ...DEFAULT_STATE };
  }
}

/* ── API: 상태 저장 ── */
async function saveState(newState) {
  try {
    await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: MODEL,
        max_tokens: 100,
        system: 'You manage a key-value store. When asked to SET key value, respond only with OK.',
        messages: [{ role: 'user', content: `SET ${STORE_KEY} ${JSON.stringify(newState)}` }]
      })
    });
  } catch(e) { /* 저장 실패는 무시하고 UI 계속 */ }
}

/* ── 렌더 ── */
function render() {
  const { account, matchOpen, picks, payments, results } = state;
  const fee = account?.fee || 5000;
  const anyOpen = matchOpen.some(Boolean);
  let html = '';

  // 계좌 카드
  if (account?.bank || account?.account || account?.holder) {
    const paidCount = picks.filter(p => payments[p.name]).length;
    const paymentChips = picks.length
      ? picks.map(p => `<div class="payment-chip ${payments[p.name] ? 'paid':'unpaid'}"><div class="pay-dot"></div>${p.name}${payments[p.name] ? ' ✓':''}</div>`).join('')
      : '<span style="font-size:0.8rem;color:var(--muted);">아직 참가자가 없습니다</span>';

    html += `<div class="account-card">
      <div class="account-header">
        <div class="account-title">입금 안내</div>
        <div class="total-badge">${picks.length}명 · ${(picks.length * fee).toLocaleString()}원</div>
      </div>
      <div class="account-row"><span class="acc-label">은행</span><span class="acc-value">${account.bank || '—'}</span></div>
      <div class="account-row"><span class="acc-label">계좌번호</span><span class="acc-value">${account.account || '—'}<button class="copy-btn" onclick="copyText('${account.account}')">복사</button></span></div>
      <div class="account-row" style="border-bottom:none;padding-bottom:0;"><span class="acc-label">예금주</span><span class="acc-value">${account.holder || '—'}</span></div>
      <div style="margin-top:1rem;padding-top:0.9rem;border-top:1px solid var(--border);">
        <div style="font-size:0.72rem;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-bottom:8px;">
          입금 현황 <span style="color:var(--green);">${picks.length ? `(${paidCount}/${picks.length}명 완료)` : ''}</span>
        </div>
        <div class="payment-grid">${paymentChips}</div>
      </div>
    </div>`;
  }

  // 참가비 배너
  html += `<div class="fee-banner">
    <div><div class="fee-label">1인 참가비</div><div class="fee-note">전액 상금으로 지급</div></div>
    <div class="fee-amount">${fee.toLocaleString()}원</div>
  </div>`;
  document.getElementById('hero-badge').textContent = `참가비 ${fee.toLocaleString()}원 · 전액 상금`;

  // 규칙
  html += `<div class="rules-card">
    <div class="section-label">규칙 안내</div>
    <ul class="rules-list">
      <li>각 경기마다 <strong>스코어를 완전히 맞춘 사람</strong>이 해당 경기 상금을 수령합니다.</li>
      <li>한 경기에서 여러 명이 맞추면 <strong>균등 배분</strong>합니다.</li>
      <li>아무도 맞추지 못한 경기의 상금은 <strong>다음 경기로 이월</strong>됩니다.</li>
      <li>3경기 모두 아무도 맞추지 못하면 <strong>전액 균등 배분</strong>합니다.</li>
    </ul>
  </div>`;

  // 경기 카드
  html += `<div class="match-section-label">경기 일정 &amp; 스코어 예측</div>`;
  MATCH_INFO.forEach((m, i) => {
    const isOpen = matchOpen[i];
    html += `<div class="match-card ${isOpen ? '' : 'closed'}">
      <div class="match-seq">${m.seq}</div>
      <div class="match-body">
        <div class="match-opponent">${m.label}</div>
        <div class="match-meta"><span>${m.date}</span><span>${m.time}</span><span>${m.venue}</span></div>
        <div><span class="status-badge ${isOpen ? 'open':'closed'}">${isOpen ? '🟢 예측 접수중':'🔴 예측 마감'}</span></div>
      </div>
      <div class="score-box">
        <input type="number" class="score-input" id="s${i}a" min="0" max="20" placeholder="0" ${isOpen ? '':'disabled'}>
        <span class="score-sep">:</span>
        <input type="number" class="score-input" id="s${i}b" min="0" max="20" placeholder="0" ${isOpen ? '':'disabled'}>
      </div>
    </div>`;
  });

  // 제출 영역
  if (anyOpen) {
    html += `<div class="name-row">
      <input type="text" class="name-input" id="pname" placeholder="이름을 입력하세요" maxlength="10">
      <button class="submit-btn" onclick="submitPick()" id="submit-btn">예측 제출 →</button>
    </div>`;
  } else {
    html += `<div class="no-open-notice">🔴 현재 접수 중인 경기가 없습니다</div>`;
  }

  // 참가자 현황
  if (picks.length) {
    const matchLabels = ['🇰🇷vs🇨🇿','🇰🇷vs🇲🇽','🇰🇷vs🇿🇦'];
    const rows = picks.map(p => {
      const scoreStr = (p.scores || []).map((s, i) =>
        s ? `${matchLabels[i]} <b>${s[0]}:${s[1]}</b>` : `${matchLabels[i]} <span style="color:var(--muted)">미접수</span>`
      ).join('<br>');
      return `<div class="participant-row">
        <span class="p-name">${p.name}${payments[p.name] ? '<span class="paid-mark">입금</span>':''}</span>
        <span class="p-scores">${scoreStr}</span>
      </div>`;
    }).join('');
    html += `<div class="participants-card">
      <div class="participants-header">
        <div class="section-label" style="margin:0;">참가자 현황 (${picks.length}명)</div>
        <div class="prize-badge">총 상금 ${(picks.length * fee).toLocaleString()}원</div>
      </div>
      ${rows}
    </div>`;
  }

  document.getElementById('main-content').innerHTML = html;
}

function copyText(txt) {
  navigator.clipboard.writeText(txt).then(() => showToast('✅ 계좌번호 복사됨'));
}

async function submitPick() {
  const btn = document.getElementById('submit-btn');
  const name = document.getElementById('pname')?.value.trim();
  if (!name) { showToast('⚠️ 이름을 입력해주세요'); return; }
  if (state.picks.find(p => p.name === name)) { showToast('⚠️ 이미 같은 이름으로 제출된 예측이 있어요'); return; }

  const scores = [0,1,2].map(i => {
    if (!state.matchOpen[i]) return null;
    const a = document.getElementById(`s${i}a`)?.value;
    const b = document.getElementById(`s${i}b`)?.value;
    if (a === '' || b === '' || a == null || b == null) return undefined;
    return [+a, +b];
  });
  if (scores.some(s => s === undefined)) { showToast('⚠️ 접수 중인 경기 스코어를 모두 입력해주세요'); return; }

  btn.disabled = true;
  btn.textContent = '저장 중...';

  const newState = {
    ...state,
    picks: [...state.picks, { name, scores, at: new Date().toISOString() }]
  };
  await saveState(newState);
  state = newState;
  showToast(`✅ ${name}님 예측 완료!`);
  render();
}

async function init() {
  state = await loadState();
  render();
}

init();
</script>
</body>
</html>
